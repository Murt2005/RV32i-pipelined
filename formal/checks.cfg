[options]
isa rv32im
solver yices

[depth]
insn            24
insn_div        56
insn_divu       56
insn_rem        56
insn_remu       56
reg       10    28
pc_fwd     8    30
pc_bwd     8    30
causal     8    30
unique     1  8 30
liveness   1  8 30
ill             24
hang       1    30
cover      1    30

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
always @* if (!reset) cover (channel[0].cnt_trap_insns == 1);

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/../../build/formal/rvfi_top.v
